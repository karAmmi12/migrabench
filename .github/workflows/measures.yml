# Mesures sur une vraie pile (#74, spec de l'étape 3, « Décisions de test »,
# Seam 1, et « Notes », critère de fin). Plusieurs jobs parallèles, un par
# groupe de mesures, chacun avec sa construction de la pile (#163, job
# measure-group) ; le job measures les rassemble :
# - le candidat de référence : mesure comptée (`--counted`) en workflow_dispatch
#   sur main, mesure de diagnostic sinon (`--counted` refuse un commit qui
#   n'est pas dans origin/main) ;
# - une seconde mesure refusée par le verrou du banc, puis la mesure
#   interrompue par SIGINT pendant l'oracle (#71) ;
# - les huit candidats défectueux du tableau de la spec ;
# - le navigateur du banc arrêté pendant l'oracle (#168) ;
# - la panne de #68 « configuration de Playwright cassée ». L'autre, « legacy
#   arrêté pendant l'oracle », reste prouvée à la main par #106 : sur le runner,
#   avec un seul worker Playwright, ses 38 scénarios attendent chacun leur délai
#   de 30 s, que `--timeout-cap-ms` ne plafonne pas (exécution 45603633524,
#   coupée à 10 min).
# Chaque mesure est contrôlée par scripts/run-measure-case.ts contre son issue
# attendue (scripts/measure-cases.ts) ; le résumé de chaque groupe en donne le
# tableau. Mesures et bruts gardés 7 jours en artefacts (ADR 0005), un par
# groupe (`measures-<groupe>`) ; la mesure comptée est récupérée de l'artefact
# `measures-reference` pour être versionnée sous results/counted/.
#
# Chaque étape de mesure lance son script par `exec` : à l'annulation du job,
# GitHub envoie SIGINT au processus d'entrée de l'étape, que le shell d'une
# étape `run` ne relaie pas (#71). Le script le relaie à la mesure.
#
# Ni ARCHIVE_SALT ni ORACLE_SALT : chaque mesure tire son sel
# (saltImposed: false, contrôlé dans measure.json et dans oracle.json).
#
# Quand il tourne (job changes, règle dans scripts/ci-scope.ts) :
# - en workflow_dispatch : toujours ;
# - sur une PR : seulement si elle touche ce que le job exécute (chemins de
#   measures dans scripts/ci-scope.ts), et pas si aucun de ces chemins n'a
#   changé depuis son dernier succès sur la PR.
name: Mesures

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau commit annule l'exécution en cours sur la même PR (#76). Hors PR
# (push sur main, workflow_dispatch), chaque exécution a son propre groupe et
# n'est jamais annulée.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Décide si le job lourd tourne (#76, #74) : règle dans scripts/ci-scope.ts.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read : lire les exécutions précédentes du workflow.
    permissions:
      contents: read
      actions: read
    outputs:
      measures: ${{ steps.scope.outputs.measures }}
    steps:
      # Historique complet : diff depuis la base de la PR et depuis la référence.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Jobs lourds à lancer
        id: scope
        env:
          CI_JOBS: measures
          GH_TOKEN: ${{ github.token }}
        run: node scripts/write-ci-scope.ts

  # Un job par groupe de mesures (#163), en parallèle, chacun avec sa propre
  # construction de la pile et son propre délai : un seul job séquentiel
  # durait 39 min 47 s pour 45 min (exécution 46015618324), et chaque porte
  # l'allongeait. Délai de chaque groupe : un peu plus du double de sa durée
  # relevée sur cette exécution (construction de la pile comprise, 1 min 20 s).
  # - reference : candidat de référence, verrou du banc et mesure
  #   interrompue, porte du relais (6 min 30 s) ;
  # - defective : candidats défectueux 1 à 8 de l'étape 3 et panne de #68
  #   (9 min 30 s) ;
  # - xss : porte XSS (13 min) ;
  # - role : porte de rôle (14 min 30 s) ;
  # - auth : porte d'authentification (#132), délai de conception, à
  #   resserrer d'après sa première durée relevée.
  # Chaque étape de mesure ne tourne que dans son groupe.
  measure-group:
    needs: changes
    if: needs.changes.outputs.measures == 'true'
    name: measures / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # Un groupe en échec n'annule pas les autres : chacun rend ses mesures.
      fail-fast: false
      matrix:
        include:
          - group: reference
            timeout: 15
          - group: defective
            timeout: 20
          - group: xss
            timeout: 30
          - group: role
            timeout: 30
          - group: auth
            timeout: 30
    env:
      # Mesure comptée seulement sur main, lancée à la main.
      REFERENCE_CASE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'reference-counted' || 'reference' }}
    steps:
      # Historique complet (#74) : `--counted` fait `git merge-base
      # --is-ancestor HEAD origin/main`, qu'un clone superficiel ferait échouer
      # dès que main a avancé. Le commit de la PR, pas le commit de fusion
      # temporaire de GitHub : benchCommit doit rester citable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances
        run: npm ci


      # Empreinte du contexte de construction de chaque image, posée en label
      # au build : une mesure refuse une pile dont les images ne viennent pas
      # de cette copie (#102).
      # Navigateur du banc (#78) : image officielle de Playwright, épinglée par
      # empreinte. Tirée dans sa propre étape pour en relever la durée.
      - name: Téléchargement de l'image du navigateur
        run: docker compose pull browser

      - name: Empreintes des contextes de la pile
        run: node scripts/stack-context-env.ts >> "$GITHUB_ENV"

      # Dépôt Maven de la construction du legacy, gardé d'une exécution à
      # l'autre sous l'empreinte du pom.xml (#149) : trouvé, il est versé dans
      # le cache de BuildKit que monte le Dockerfile du legacy, et la
      # construction ne dépend plus de Maven Central.
      - name: Restauration du dépôt Maven
        id: maven-repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/maven-repository
          key: maven-repository-${{ runner.os }}-${{ hashFiles('fixtures/legacy-app/pom.xml') }}

      - name: Versement du dépôt Maven dans le cache de construction
        if: steps.maven-repository.outputs.cache-hit == 'true'
        run: scripts/maven-cache.sh import "$RUNNER_TEMP/maven-repository"

      - name: Construction des images
        run: docker compose build

      # Pas de dépôt trouvé : celui que la construction vient de remplir est
      # extrait du cache de BuildKit et sauvé sous la clé (#149). Un incident
      # du cache ne fait jamais échouer le job.
      - name: Extraction du dépôt Maven
        if: steps.maven-repository.outputs.cache-hit != 'true'
        continue-on-error: true
        run: scripts/maven-cache.sh export "$RUNNER_TEMP/maven-repository"

      - name: Sauvegarde du dépôt Maven
        if: steps.maven-repository.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/maven-repository
          key: ${{ steps.maven-repository.outputs.cache-primary-key }}

      - name: En-tête du résumé
        run: |
          {
            echo "## Mesures"
            echo
            echo "| Cas | Mesure | Issue | Code | Contrôle |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

      # En premier : l'arbre de travail est encore propre, une condition de
      # `--counted`. Le premigrabench n'est pas lancé : le script appelle
      # runner/cli.ts, et setup-node a pris la version de .nvmrc.
      - name: Candidat de référence
        if: matrix.group == 'reference'
        run: exec node scripts/run-measure-case.ts "$REFERENCE_CASE"

      - name: Verrou du banc et mesure interrompue
        if: ${{ !cancelled() && matrix.group == 'reference' }}
        run: exec node scripts/interrupt-measure.ts

      - name: Candidat défectueux 1, contrat invalide
        if: ${{ !cancelled() && matrix.group == 'defective' }}
        run: exec node scripts/run-measure-case.ts contract-invalid

      - name: Candidat défectueux 2, construction en échec
        if: ${{ !cancelled() && matrix.group == 'defective' }}
        run: exec node scripts/run-measure-case.ts build-fails

      - name: Candidat défectueux 3, construction trop longue
        if: ${{ !cancelled() && matrix.group == 'defective' }}
        run: exec node scripts/run-measure-case.ts build-never-ends

      - name: Candidat défectueux 4, jamais disponible
        if: ${{ !cancelled() && matrix.group == 'defective' }}
        run: exec node scripts/run-measure-case.ts never-ready

      - name: Candidat défectueux 5, sonde d'isolation
        if: ${{ !cancelled() && matrix.group == 'defective' }}
        run: exec node scripts/run-measure-case.ts isolation-probe

      - name: Candidat défectueux 6, relais qui altère un libellé
        if: ${{ !cancelled() && matrix.group == 'defective' }}
        run: exec node scripts/run-measure-case.ts relay-alters-label

      # Porte du relais (#124) : le test négatif est le candidat de référence ;
      # ces deux candidats coupent toute connexion après leur disponibilité,
      # pour que l'oracle échoue vite.
      - name: Porte du relais, candidat qui imite le healthcheck
        if: ${{ !cancelled() && matrix.group == 'reference' }}
        run: exec node scripts/run-measure-case.ts relay-forged-healthcheck

      - name: Porte du relais, candidat conforme
        if: ${{ !cancelled() && matrix.group == 'reference' }}
        run: exec node scripts/run-measure-case.ts relay-untouched

      # Porte XSS (#129) : le test négatif est le candidat de référence, qui
      # échoue sur la recherche. Ces quatre relais ne réécrivent que les pages
      # porteuses de la charge : l'oracle y réussit ses 38 scénarios.
      - name: Porte XSS, candidat conforme qui échappe
        if: ${{ !cancelled() && matrix.group == 'xss' }}
        run: exec node scripts/run-measure-case.ts xss-escapes

      - name: Porte XSS, candidat qui assainit
        if: ${{ !cancelled() && matrix.group == 'xss' }}
        run: exec node scripts/run-measure-case.ts xss-sanitizes

      - name: Porte XSS, candidat qui injecte sur la fiche
        if: ${{ !cancelled() && matrix.group == 'xss' }}
        run: exec node scripts/run-measure-case.ts xss-injects-on-sheet

      - name: Porte XSS, candidat qui exécute puis efface
        if: ${{ !cancelled() && matrix.group == 'xss' }}
        run: exec node scripts/run-measure-case.ts xss-executes-then-erases

      # Porte de rôle (#131) : le test négatif est le candidat de référence,
      # dont le rejeu en agent remet le dossier. Chaque mesure redémarre trois
      # fois le legacy pour cette porte (témoins start-2 à start-4). Ces relais ne changent que
      # la fiche, la remise et la requête de remise.
      - name: Porte de rôle, bouton masqué dans la vue
        if: ${{ !cancelled() && matrix.group == 'role' }}
        run: exec node scripts/run-measure-case.ts role-button-hidden-in-view

      - name: Porte de rôle, écran protégé seulement par son lien
        if: ${{ !cancelled() && matrix.group == 'role' }}
        run: exec node scripts/run-measure-case.ts role-screen-protected-by-link

      - name: Porte de rôle, jeton anti-CSRF sans contrôle de rôle
        if: ${{ !cancelled() && matrix.group == 'role' }}
        run: exec node scripts/run-measure-case.ts role-csrf-without-role-check

      - name: Porte de rôle, candidat conforme avec jeton et contrôle de rôle
        if: ${{ !cancelled() && matrix.group == 'role' }}
        run: exec node scripts/run-measure-case.ts role-csrf-and-role-check

      # Porte d'authentification (#132) : le legacy, par le candidat de
      # référence, passe. Chaque mesure redémarre encore deux fois le legacy
      # (témoins start-5 et start-6). Ces relais ne changent que l'exigence
      # d'identifiants.
      - name: Porte d'authentification, lecture et écriture sans contrôle
        if: ${{ !cancelled() && matrix.group == 'auth' }}
        run: exec node scripts/run-measure-case.ts auth-read-and-write-unchecked

      - name: Porte d'authentification, jeton anti-CSRF et écriture sans contrôle
        if: ${{ !cancelled() && matrix.group == 'auth' }}
        run: exec node scripts/run-measure-case.ts auth-csrf-write-unchecked

      # La composition ajoutée par COMPOSE_FILE ne vaut que pour cette mesure :
      # la suivante recrée un legacy sain.
      - name: Candidat défectueux 7, pile volontairement cassée
        if: ${{ !cancelled() && matrix.group == 'defective' }}
        run: exec node scripts/run-measure-case.ts broken-stack

      # Navigateur du banc arrêté dès que Playwright tourne (#168) : la mesure
      # suivante recrée le service `browser` avec la pile.
      - name: "Navigateur du banc arrêté pendant l'oracle (#168)"
        if: ${{ !cancelled() && matrix.group == 'defective' }}
        run: exec node scripts/run-measure-case.ts browser-stopped-during-oracle

      # Images de la pile construites avec une empreinte de contexte étrangère
      # à cette copie, puis reconstruites avec la sienne.
      - name: Candidat défectueux 8, images d'une autre copie
        if: ${{ !cancelled() && matrix.group == 'defective' }}
        run: |
          foreign="sha256:$(printf '0%.0s' $(seq 64))"
          MB_LEGACY_CONTEXT_DIGEST="$foreign" MB_ARCHIVE_CONTEXT_DIGEST="$foreign" docker compose build

      - name: Candidat défectueux 8, mesure
        if: ${{ !cancelled() && matrix.group == 'defective' }}
        run: exec node scripts/run-measure-case.ts foreign-stack

      - name: Candidat défectueux 8, images de cette copie
        if: ${{ !cancelled() && matrix.group == 'defective' }}
        run: docker compose build

      # Le fichier modifié fait partie du contexte de la pile : les images
      # sont reconstruites avec l'empreinte de la copie modifiée, sans quoi la
      # mesure rendrait stack-not-from-this-copy avant l'oracle. En dernier :
      # l'arbre de travail n'est plus propre.
      - name: "Panne de #68, configuration de Playwright cassée"
        if: ${{ !cancelled() && matrix.group == 'defective' }}
        run: |
          echo 'throw new Error("oracle config broken on purpose (#74)");' >> oracle/playwright.config.ts
          env $(node scripts/stack-context-env.ts) docker compose build

      - name: "Panne de #68, mesure"
        if: ${{ !cancelled() && matrix.group == 'defective' }}
        run: exec node scripts/run-measure-case.ts oracle-config-broken

      - name: "Panne de #68, configuration rétablie"
        if: always() && matrix.group == 'defective'
        run: git checkout -- oracle/playwright.config.ts

      - name: Journaux de la pile
        if: always()
        run: |
          mkdir -p .oracle-artifacts
          docker compose ps --all > .oracle-artifacts/compose-ps.txt
          docker compose logs --no-color --timestamps > .oracle-artifacts/compose-logs.txt

      - name: Publication des mesures et des bruts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measures-${{ matrix.group }}
          path: |
            results/counted/
            results/diagnostic/
            .oracle-artifacts/
            !.oracle-artifacts/**/node_modules/
            !.oracle-artifacts/**/npm-cache/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # Rassemble les groupes (#163). Son nom, `measures`, est celui que cherche
  # scripts/ci-scope.ts pour savoir si les mesures ont réussi sur un commit :
  # il réussit seulement si chaque job de groupe a réussi. Son résumé donne la durée
  # de chaque groupe, leur somme et le plus long.
  measures:
    needs: [changes, measure-group]
    if: ${{ always() && needs.changes.outputs.measures == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read : lire les jobs de cette exécution.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Échoue si un groupe n'a pas réussi : la conclusion de chaque job est
      # lue sur l'API, et non déduite du résultat global de la matrice.
      - name: Durées et issue des jobs de mesures
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/write-measure-durations.ts
