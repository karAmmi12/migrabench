# Contrôle des actions épinglées par SHA (#22).
# Règle et procédure : docs/agents/pinned-actions.md.
name: Actions épinglées

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

# Un nouveau commit annule l'exécution en cours sur la même PR (#76). Hors PR
# (push sur main, workflow_dispatch), chaque exécution a son propre groupe et
# n'est jamais annulée.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pinned-actions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Chaque uses est épinglé par SHA
        run: bash scripts/check-pinned-actions.sh .github/workflows
