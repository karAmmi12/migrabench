# Tests du banc avec la pile Docker, sur chaque PR (#20).
# Le typecheck n'en fait pas partie : job séparé, sans Docker (#23).
name: Tests du banc

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    # Borne un blocage hors healthcheck (défaut GitHub : 360 min).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      # Un sel par job pour la référence d'archivage (#33) : la pile le passe au
      # seul service d'archivage, les tests du seam A le lisent pour calculer
      # la référence attendue. Jamais dans .env, que lit aussi le legacy.
      - name: Tirage du sel d'archivage
        run: |
          salt="$(openssl rand -hex 32)"
          echo "::add-mask::$salt"
          echo "ARCHIVE_SALT=$salt" >> "$GITHUB_ENV"

      # --wait attend que les healthchecks du legacy et du service
      # d'archivage passent ; il échoue si l'un d'eux ne passe pas.
      - name: Construction et démarrage de la pile
        run: docker compose up -d --build --wait

      # Le pretest vérifie que Node est celui de .nvmrc.
      - name: Tests
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml

      - name: Journaux de la pile
        if: always()
        run: |
          mkdir -p test-results
          docker compose ps --all > test-results/compose-ps.txt
          docker compose logs --no-color --timestamps > test-results/compose-logs.txt

      - name: Publication des traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-tests
          path: test-results/
          retention-days: 7
          if-no-files-found: error
