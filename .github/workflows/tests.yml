# Tests du banc avec la pile Docker, sur chaque PR (#20). Ignorés si la PR ne
# touche que docs/** (#83), ou si seul docs/** a changé depuis leur dernier
# succès sur la PR (#76, job changes).
# Le typecheck n'en fait pas partie : job séparé, sans Docker (#23).
name: Tests du banc

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

# Un nouveau commit annule l'exécution en cours sur la même PR (#76). Hors PR
# (push sur main, workflow_dispatch), chaque exécution a son propre groupe et
# n'est jamais annulée.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Décide quels jobs lourds tournent (#76) : règle dans scripts/ci-scope.ts.
  # Sur une PR, un job est ignoré si la PR ne touche que docs/** (#83), ou si
  # seul docs/** a changé depuis le dernier commit de la PR où ce même job a
  # réussi. Condition au niveau du job, pas
  # filtre paths sous on: : un job ignoré compte comme réussi pour une
  # vérification obligatoire, un workflow filtré resterait « en attente ».
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read : lire les exécutions précédentes du workflow.
    permissions:
      contents: read
      actions: read
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      # Historique complet : diff depuis la base de la PR et depuis la référence.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Jobs lourds à lancer
        id: scope
        env:
          CI_JOBS: tests
          GH_TOKEN: ${{ github.token }}
        run: node scripts/write-ci-scope.ts

  tests:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    # Borne un blocage hors healthcheck (défaut GitHub : 360 min).
    timeout-minutes: 30
    steps:
      # Le contrôle des résultats d'oracle versionnés (#53) exige que le commit
      # du banc de chaque résultat soit un objet du dépôt. Les PR étant fusionnées
      # en squash, ce commit n'est joignable que par la tête de sa PR : historique
      # complet, puis récupération des têtes de PR (refs/pull/*/head).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      # Commande dans package.json : c'est elle que rappelle un échec en local.
      - name: Récupération des têtes de PR
        run: npm run fetch:pull-heads

      # Un sel par job pour la référence d'archivage (#33) : la pile le passe au
      # seul service d'archivage, les tests du seam A le lisent pour calculer
      # la référence attendue. Jamais dans .env, que lit aussi le legacy.
      - name: Tirage du sel d'archivage
        run: |
          salt="$(openssl rand -hex 32)"
          echo "::add-mask::$salt"
          echo "ARCHIVE_SALT=$salt" >> "$GITHUB_ENV"

      # Empreinte du contexte de construction de chaque image, posée en label
      # au build : une mesure, l'oracle et l'étalonnage refusent une pile dont
      # les images ne viennent pas de cette copie du dépôt (#102).
      - name: Empreintes des contextes de la pile
        run: node scripts/stack-context-env.ts >> "$GITHUB_ENV"

      # --wait attend que les healthchecks du legacy et du service
      # d'archivage passent ; il échoue si l'un d'eux ne passe pas.
      - name: Construction et démarrage de la pile
        run: docker compose up -d --build --wait

      # Le pretest vérifie que Node est celui de .nvmrc.
      - name: Tests
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml

      - name: Journaux de la pile
        if: always()
        run: |
          mkdir -p test-results
          docker compose ps --all > test-results/compose-ps.txt
          docker compose logs --no-color --timestamps > test-results/compose-logs.txt

      - name: Publication des traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-tests
          path: test-results/
          retention-days: 7
          if-no-files-found: error
