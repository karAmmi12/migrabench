# Oracle contre le legacy (#39, spec de l'étape 2, « CI »).
# Chromium seul. Traces, HAR et résultats JSON gardés 7 jours (ADR 0005).
#
# Deux jobs :
# - oracle : une exécution complète ;
# - proof : le critère de fin de l'étape 2. Images construites une seule fois,
#   puis 5 exécutions complètes consécutives sur ces mêmes images ; chacune
#   recrée la pile et tire son propre sel. Les 5 résultats sont vérifiés
#   ensemble (npm run oracle:proof) avant d'être publiés.
#
# Quand ils tournent (#76, job changes, règle dans scripts/ci-scope.ts) :
# - sur push vers main et en workflow_dispatch : toujours, les deux ;
# - sur une PR : oracle, sauf si la PR ne touche que docs/** (#83) ou si seul
#   docs/** a changé depuis son dernier succès sur la PR ; proof, de même, et seulement si la PR touche oracle/,
#   fixtures/legacy-app/, docker-compose.yml ou results/oracle/.
#
# Ni ARCHIVE_SALT ni ORACLE_SALT ne sont définis : une mesure tire toujours son
# sel (saltImposed: false). Chaque résultat porte son ciRun (identifiant et
# tentative de l'exécution de CI, rang ORACLE_CI_RANK) dans ses métadonnées et
# dans le nom de son fichier.
name: Oracle

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau commit annule l'exécution en cours sur la même PR (#76). Hors PR
# (push sur main, workflow_dispatch), chaque exécution a son propre groupe et
# n'est jamais annulée.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Décide quels jobs lourds tournent (#76) : règle dans scripts/ci-scope.ts.
  # Sur une PR, un job est ignoré si la PR ne touche que docs/** (#83), ou si
  # seul docs/** a changé depuis le dernier commit de la PR où ce même job a
  # réussi. Condition au niveau du job, pas
  # filtre paths sous on: : un job ignoré compte comme réussi pour une
  # vérification obligatoire, un workflow filtré resterait « en attente ».
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read : lire les exécutions précédentes du workflow.
    permissions:
      contents: read
      actions: read
    outputs:
      oracle: ${{ steps.scope.outputs.oracle }}
      proof: ${{ steps.scope.outputs.proof }}
    steps:
      # Historique complet : diff depuis la base de la PR et depuis la référence.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Jobs lourds à lancer
        id: scope
        env:
          CI_JOBS: oracle,proof
          GH_TOKEN: ${{ github.token }}
        run: node scripts/write-ci-scope.ts

  oracle:
    needs: changes
    if: needs.changes.outputs.oracle == 'true'
    runs-on: ubuntu-24.04
    # Borne un blocage hors healthcheck (défaut GitHub : 360 min).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Le commit de la PR, pas le commit de fusion temporaire de GitHub :
          # benchCommit doit rester citable une fois la PR fusionnée. Hors PR
          # (push, workflow_dispatch), le commit qui a déclenché l'exécution.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances
        run: npm ci


      # Empreinte du contexte de construction de chaque image, posée en label
      # au build : une mesure, l'oracle et l'étalonnage refusent une pile dont
      # les images ne viennent pas de cette copie du dépôt (#102).
      # Navigateur du banc (#78) : image officielle de Playwright, épinglée par
      # empreinte. Tirée dans sa propre étape pour en relever la durée.
      - name: Téléchargement de l'image du navigateur
        run: docker compose pull browser

      - name: Empreintes des contextes de la pile
        run: node scripts/stack-context-env.ts >> "$GITHUB_ENV"

      # Dépôt Maven de la construction du legacy, gardé d'une exécution à
      # l'autre sous l'empreinte du pom.xml (#149) : trouvé, il est versé dans
      # le cache de BuildKit que monte le Dockerfile du legacy, et la
      # construction ne dépend plus de Maven Central.
      - name: Restauration du dépôt Maven
        id: maven-repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/maven-repository
          key: maven-repository-${{ runner.os }}-${{ hashFiles('fixtures/legacy-app/pom.xml') }}

      - name: Versement du dépôt Maven dans le cache de construction
        if: steps.maven-repository.outputs.cache-hit == 'true'
        run: scripts/maven-cache.sh import "$RUNNER_TEMP/maven-repository"

      # Étape distincte : l'exécution complète recrée les conteneurs sans
      # reconstruire les images.
      - name: Construction des images
        run: docker compose build

      # Pas de dépôt trouvé : celui que la construction vient de remplir est
      # extrait du cache de BuildKit et sauvé sous la clé (#149).
      - name: Extraction du dépôt Maven
        if: steps.maven-repository.outputs.cache-hit != 'true'
        run: scripts/maven-cache.sh export "$RUNNER_TEMP/maven-repository"

      - name: Sauvegarde du dépôt Maven
        if: steps.maven-repository.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/maven-repository
          key: ${{ steps.maven-repository.outputs.cache-primary-key }}

      # Le preoracle vérifie que Node est celui de .nvmrc.
      - name: Exécution complète de l'oracle
        env:
          ORACLE_CI_RANK: "1"
        run: npm run oracle

      - name: Journaux de la pile
        if: always()
        run: |
          mkdir -p .oracle-artifacts
          docker compose ps --all > .oracle-artifacts/compose-ps.txt
          docker compose logs --no-color --timestamps > .oracle-artifacts/compose-logs.txt

      - name: Publication des résultats et des bruts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle
          path: |
            results/oracle/*-ci${{ github.run_id }}.${{ github.run_attempt }}-*.json
            .oracle-artifacts/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # proof peut tourner quand oracle est ignoré : leurs dernières réussites
  # peuvent porter sur des commits différents.
  proof:
    needs: [changes, oracle]
    if: >-
      !cancelled()
      && needs.changes.outputs.proof == 'true'
      && (needs.oracle.result == 'success' || needs.oracle.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Le commit de la PR, pas le commit de fusion temporaire de GitHub :
          # benchCommit doit rester citable une fois la PR fusionnée. Hors PR
          # (push, workflow_dispatch), le commit qui a déclenché l'exécution.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances
        run: npm ci


      # Empreinte du contexte de construction de chaque image, posée en label
      # au build : une mesure, l'oracle et l'étalonnage refusent une pile dont
      # les images ne viennent pas de cette copie du dépôt (#102).
      # Navigateur du banc (#78) : image officielle de Playwright, épinglée par
      # empreinte. Tirée dans sa propre étape pour en relever la durée.
      - name: Téléchargement de l'image du navigateur
        run: docker compose pull browser

      - name: Empreintes des contextes de la pile
        run: node scripts/stack-context-env.ts >> "$GITHUB_ENV"

      # Dépôt Maven de la construction du legacy, gardé d'une exécution à
      # l'autre sous l'empreinte du pom.xml (#149) : trouvé, il est versé dans
      # le cache de BuildKit que monte le Dockerfile du legacy, et la
      # construction ne dépend plus de Maven Central.
      - name: Restauration du dépôt Maven
        id: maven-repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/maven-repository
          key: maven-repository-${{ runner.os }}-${{ hashFiles('fixtures/legacy-app/pom.xml') }}

      - name: Versement du dépôt Maven dans le cache de construction
        if: steps.maven-repository.outputs.cache-hit == 'true'
        run: scripts/maven-cache.sh import "$RUNNER_TEMP/maven-repository"

      # Une seule construction pour les 5 exécutions : même empreinte d'images.
      - name: Construction des images
        run: docker compose build

      # Pas de dépôt trouvé : celui que la construction vient de remplir est
      # extrait du cache de BuildKit et sauvé sous la clé (#149).
      - name: Extraction du dépôt Maven
        if: steps.maven-repository.outputs.cache-hit != 'true'
        run: scripts/maven-cache.sh export "$RUNNER_TEMP/maven-repository"

      - name: Sauvegarde du dépôt Maven
        if: steps.maven-repository.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/maven-repository
          key: ${{ steps.maven-repository.outputs.cache-primary-key }}

      # Consécutives : la première exécution qui échoue arrête le job (bash -e).
      - name: Cinq exécutions complètes de l'oracle
        run: |
          for rank in 1 2 3 4 5; do
            echo "::group::Exécution complète ${rank}/5"
            ORACLE_CI_RANK="$rank" npm run oracle
            echo "::endgroup::"
          done

      - name: Vérification de la preuve
        run: npm run oracle:proof -- results/oracle/*-ci${{ github.run_id }}.${{ github.run_attempt }}-*.json

      - name: Journaux de la pile
        if: always()
        run: |
          mkdir -p .oracle-artifacts
          docker compose ps --all > .oracle-artifacts/compose-ps.txt
          docker compose logs --no-color --timestamps > .oracle-artifacts/compose-logs.txt

      - name: Publication des résultats et des bruts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-proof
          path: |
            results/oracle/*-ci${{ github.run_id }}.${{ github.run_attempt }}-*.json
            .oracle-artifacts/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
