# Une PR qui ferme un ticket (mot-clé GitHub de fermeture : close, closes,
# closed, fix, fixes, fixed, resolve, resolves, resolved, en toute casse)
# apporte sa fiche de formation docs/formation/journal/N-*.md, rédigée avec
# /fiche-ticket.
name: Fiche de formation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  fiche-ticket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Une fiche par ticket fermé par la PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          tickets=$(printf '%s' "$PR_BODY" | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+' | grep -oE '[0-9]+' | sort -un || true)
          if [ -z "$tickets" ]; then
            echo "Aucun ticket fermé par la PR : rien à vérifier."
            exit 0
          fi
          missing=0
          for n in $tickets; do
            if compgen -G "docs/formation/journal/${n}-*.md" > /dev/null; then
              echo "Fiche trouvée pour #${n}."
            else
              echo "::error::Fiche manquante pour #${n} : ajouter docs/formation/journal/${n}-<nom-court>.md (lancer /fiche-ticket)."
              missing=1
            fi
          done
          exit "$missing"
