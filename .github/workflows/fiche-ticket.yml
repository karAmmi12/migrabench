# Une PR qui ferme un ticket (mot-clé GitHub de fermeture : close, closes,
# closed, fix, fixes, fixed, resolve, resolves, resolved, en toute casse)
# apporte sa fiche de formation docs/formation/journal/N-*.md, rédigée avec
# /fiche-ticket.
# Chaque case cochée du plan de test qui contient un nombre cite l'état où il
# a été obtenu, un commit réel du dépôt ou un lien de job de CI (#54). Le
# commit est vérifié par Git (#96) : il faut l'historique complet et les têtes
# de PR, seules à joindre les commits d'une PR fusionnée en squash.
# Les deux contrôles lisent le corps de la PR, nettoyé de son code par la même
# fonction (scripts/pr-body.ts).
name: Fiche de formation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# Un nouveau commit annule l'exécution en cours sur la même PR (#76). Hors PR
# (push sur main, workflow_dispatch), chaque exécution a son propre groupe et
# n'est jamais annulée.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fiche-ticket:
    runs-on: ubuntu-24.04
    steps:
      # Historique complet : un clone superficiel rend chaque SHA invérifiable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Node de .nvmrc : les scripts sont en TypeScript, lancés sans compilation.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Une fiche par ticket fermé par la PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-training-sheet.ts

      # Commande dans package.json : c'est elle que rappelle un échec en local.
      - name: Récupération des têtes de PR
        id: pull-heads
        if: ${{ !cancelled() }}
        run: npm run fetch:pull-heads

      # Lancée même si la fiche manque : les deux manquements sont signalés
      # ensemble. Pas sans les têtes de PR : un commit cité y passerait pour
      # inexistant.
      - name: Chaque case cochée chiffrée cite un état
        if: ${{ !cancelled() && steps.pull-heads.outcome == 'success' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-test-plan-evidence.ts
