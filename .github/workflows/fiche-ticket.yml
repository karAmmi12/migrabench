# Une PR qui ferme un ticket (mot-clé GitHub de fermeture : close, closes,
# closed, fix, fixes, fixed, resolve, resolves, resolved, en toute casse)
# apporte sa fiche de formation docs/formation/journal/N-*.md, rédigée avec
# /fiche-ticket.
# Chaque case cochée du plan de test qui contient un nombre cite l'état où il
# a été obtenu, un SHA de commit ou un lien de job de CI (#54).
# Les deux contrôles lisent le corps de la PR, nettoyé de son code par la même
# fonction (scripts/pr-body.ts).
name: Fiche de formation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# Un nouveau commit annule l'exécution en cours sur la même PR (#76). Hors PR
# (push sur main, workflow_dispatch), chaque exécution a son propre groupe et
# n'est jamais annulée.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fiche-ticket:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node de .nvmrc : les scripts sont en TypeScript, lancés sans compilation.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Une fiche par ticket fermé par la PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-training-sheet.ts

      # Lancée même si la fiche manque : les deux manquements sont signalés ensemble.
      - name: Chaque case cochée chiffrée cite un état
        if: ${{ !cancelled() }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-test-plan-evidence.ts
