errors.search.number.mask=Le num\u00e9ro doit \u00eatre au format D- suivi de 4 chiffres, par exemple D-0001.
# La date « Déposé du » doit être au format jj/mm/aaaa.
errors.search.filedFrom.date=La date \u00ab D\u00e9pos\u00e9 du \u00bb doit \u00eatre au format jj/mm/aaaa.
# La date « Déposé au » doit être au format jj/mm/aaaa.
errors.search.filedTo.date=La date \u00ab D\u00e9pos\u00e9 au \u00bb doit \u00eatre au format jj/mm/aaaa.
# La date « Déposé au » doit être postérieure ou égale à la date « Déposé du ».
errors.search.filedTo.validwhen=La date \u00ab D\u00e9pos\u00e9 au \u00bb doit \u00eatre post\u00e9rieure ou \u00e9gale \u00e0 la date \u00ab D\u00e9pos\u00e9 du \u00bb.

