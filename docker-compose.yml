name: migrabench

services:
  legacy:
    build:
      context: .
      dockerfile: fixtures/legacy-app/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    # Valeurs du banc (horloge figée FROZEN_DATE), passées telles quelles au
    # conteneur : une variable du shell ne peut pas les remplacer. Sans
    # FROZEN_DATE, le legacy refuse de démarrer.
    env_file: .env
    healthcheck:
      # Prêt quand l'application déployée exige l'authentification (401).
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ | grep -q 401"]
      interval: 2s
      timeout: 2s
      retries: 60
