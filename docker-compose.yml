name: migrabench

services:
  legacy:
    build:
      context: .
      dockerfile: fixtures/legacy-app/Dockerfile
    # Seul le port 8080 (JSP) est publié. Le port 8081 (API interne) n'est
    # pas joignable depuis l'hôte ; la couche serveur du candidat l'appelle
    # par mb-internal. Limite connue : default le joint aussi (ADR 0004).
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - default
      - mb-internal
    # Valeurs du banc (horloge figée FROZEN_DATE, valeur témoin ARCHIVE_TOKEN),
    # passées telles quelles au conteneur : une variable du shell ne peut pas
    # les remplacer. Sans FROZEN_DATE, le legacy refuse de démarrer.
    env_file: .env
    # Journal d'accès du banc (#67) : connecteur 8080 seul, écrit en ajout sur
    # l'hôte, il survit aux redémarrages du legacy. Une mesure le dirige vers
    # le dossier de ses bruts (MB_ACCESS_LOG_DIR) ; sinon, un dossier ignoré
    # par Git de la copie du dépôt qui a lancé la pile.
    volumes:
      - ${MB_ACCESS_LOG_DIR:-./.oracle-artifacts/access-log}:/usr/local/tomcat/logs/migrabench
    healthcheck:
      # Prêt quand l'application déployée exige l'authentification (401).
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ | grep -q 401"]
      interval: 2s
      timeout: 2s
      retries: 60

  # Service d'archivage simulé : un fichier, une route (fixtures/archive-service).
  # Sur mb-internal pour la couche serveur du candidat, et publié sur l'hôte
  # pour que le navigateur suive le lien « Accusé de remise » du legacy (ADR 0004).
  archive:
    build:
      context: .
      dockerfile: fixtures/archive-service/Dockerfile
    ports:
      - "127.0.0.1:8090:8090"
    # Même .env que le legacy : la valeur témoin ARCHIVE_TOKEN est la même des deux côtés.
    env_file: .env
    # Sel de la référence d'archivage, au seul service d'archivage, depuis
    # l'environnement du shell (`npm run oracle`, CI), jamais depuis .env que
    # lit aussi le legacy. Absent du shell, la variable n'est pas transmise et
    # le service tire son propre sel (TRAPS.md, « Référence d'archivage »).
    environment:
      - ARCHIVE_SALT
    networks:
      - default
      - mb-internal
    healthcheck:
      # Prêt quand le service refuse une requête sans jeton (403).
      test: ["CMD", "node", "-e", "fetch('http://localhost:8090/accuse-de-remise').then((r) => process.exit(r.status === 403 ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

networks:
  # Réseau sans sortie vers l'extérieur (ADR 0004) : port 8081 du legacy
  # (API interne), service d'archivage, et couche serveur du candidat à venir.
  mb-internal:
    internal: true
