name: migrabench

services:
  legacy:
    build:
      context: .
      dockerfile: fixtures/legacy-app/Dockerfile
      # Empreinte du contexte de construction, calculée sur la copie du dépôt
      # qui construit (oracle/stack-images.ts) : une mesure vérifie que l'image
      # en cours vient de sa propre copie (#102). Vide hors outils du banc.
      labels:
        org.migrabench.context-digest: ${MB_LEGACY_CONTEXT_DIGEST:-}
    # Seul le port 8080 (JSP) est publié. Le port 8081 (API interne) n'est
    # pas joignable depuis l'hôte ; la couche serveur du candidat l'appelle
    # par mb-internal. Tomcat n'écoute 8081 que sur l'adresse du legacy dans
    # mb-internal, nommée par l'alias legacy-internal-api : default ne le
    # joint pas (ADR 0004, #78).
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CATALINA_OPTS: "-Dmb.internalApiAddress=legacy-internal-api"
    networks:
      default: {}
      mb-internal:
        aliases: [legacy-internal-api]
    # Valeurs du banc (horloge figée FROZEN_DATE, valeur témoin ARCHIVE_TOKEN),
    # passées telles quelles au conteneur : une variable du shell ne peut pas
    # les remplacer. Sans FROZEN_DATE, le legacy refuse de démarrer.
    env_file: .env
    # Journal d'accès du banc (#67) : connecteur 8080 seul, écrit en ajout sur
    # l'hôte, il survit aux redémarrages du legacy. Une mesure le dirige vers
    # le dossier de ses bruts (MB_ACCESS_LOG_DIR), qu'elle crée elle-même ;
    # sinon, .access-log/ de la copie du dépôt qui a lancé la pile, ignoré par
    # Git. Pas sous .oracle-artifacts/ : sous Linux, Docker crée en root la
    # source manquante d'un montage, et le runner ne pourrait plus y écrire.
    volumes:
      - ${MB_ACCESS_LOG_DIR:-./.access-log}:/usr/local/tomcat/logs/migrabench
    healthcheck:
      # Prêt quand l'application déployée exige l'authentification (401), et
      # quand l'API interne répond sur son alias de mb-internal (#78) : un
      # alias non résolu au démarrage laisserait 8081 fermé sans autre signe.
      # Le journal d'accès du banc écarte 8081.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ | grep -q 401 && curl -s -o /dev/null -w '%{http_code}' http://legacy-internal-api:8081/api/dossiers/D-0001 | grep -q 200"]
      interval: 2s
      timeout: 2s
      retries: 60

  # Service d'archivage simulé : un fichier, une route (fixtures/archive-service).
  # Sur mb-internal pour la couche serveur du candidat, et publié sur l'hôte
  # pour que le navigateur suive le lien « Accusé de remise » du legacy (ADR 0004).
  archive:
    build:
      context: .
      dockerfile: fixtures/archive-service/Dockerfile
      labels:
        org.migrabench.context-digest: ${MB_ARCHIVE_CONTEXT_DIGEST:-}
    ports:
      - "127.0.0.1:8090:8090"
    # Même .env que le legacy : la valeur témoin ARCHIVE_TOKEN est la même des deux côtés.
    env_file: .env
    # Sel de la référence d'archivage, au seul service d'archivage, depuis
    # l'environnement du shell (`npm run oracle`, CI), jamais depuis .env que
    # lit aussi le legacy. Absent du shell, la variable n'est pas transmise et
    # le service tire son propre sel (TRAPS.md, « Référence d'archivage »).
    environment:
      - ARCHIVE_SALT
    networks:
      - default
      - mb-internal
    healthcheck:
      # Prêt quand le service refuse une requête sans jeton (403).
      test: ["CMD", "node", "-e", "fetch('http://localhost:8090/accuse-de-remise').then((r) => process.exit(r.status === 403 ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Navigateur du banc (#78) : Chromium et ses dépendances système figés par
  # l'empreinte de l'image officielle de Playwright (oracle/browser.ts), avec
  # le serveur de Playwright du dépôt (fixtures/browser/server.mjs), joint
  # seulement avec le jeton de la pile (#160). Sur
  # default seul : il joint le legacy, le service d'archivage et le candidat
  # par son relais local, jamais l'API interne (ADR 0004). Recréé à chaque
  # exécution de l'oracle, comme le reste de la pile.
  browser:
    image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    init: true
    shm_size: 1gb
    command: ["node", "/opt/bench/server.mjs"]
    # Jeton de la pile (#134, #160), tiré à chaque démarrage par le banc et
    # passé par l'environnement du shell : les deux passerelles, celle du
    # serveur de Playwright et celle du CDP, refusent toute requête qui ne le
    # porte pas. Absent du shell, elles refusent tout, et le service ne
    # devient jamais sain.
    environment:
      - MB_BROWSER_TOKEN
    volumes:
      - ./node_modules/playwright-core:/opt/playwright-core:ro
      - ./fixtures/browser/server.mjs:/opt/bench/server.mjs:ro
      - ./fixtures/browser/token-gateway.mjs:/opt/bench/token-gateway.mjs:ro
      - ./fixtures/browser/cdp-gateway.mjs:/opt/bench/cdp-gateway.mjs:ro
      - ./fixtures/browser/playwright-gateway.mjs:/opt/bench/playwright-gateway.mjs:ro
    ports:
      # Passerelle du serveur de Playwright (fixtures/browser/playwright-gateway.mjs).
      - "127.0.0.1:8095:3000"
      # Passerelle CDP (fixtures/browser/cdp-gateway.mjs), pour Lighthouse.
      - "127.0.0.1:8096:9222"
    networks:
      - default
    healthcheck:
      # Prêt quand le serveur de Playwright répond à sa découverte, demandée
      # avec le jeton par sa passerelle : la passerelle et `run-server` sont
      # tous deux en écoute.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/' + process.env.MB_BROWSER_TOKEN + '/json').then((r) => r.json()).then((j) => process.exit(j.wsEndpointPath === '/' ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

networks:
  # Réseau sans sortie vers l'extérieur (ADR 0004) : port 8081 du legacy
  # (API interne), service d'archivage, et couche serveur du candidat à venir.
  mb-internal:
    internal: true
